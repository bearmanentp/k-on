name: Deploy K-ON fandom site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate Firebase configuration
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY" || (echo "Missing GitHub Actions secret: FIREBASE_API_KEY" && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" || (echo "Missing GitHub Actions secret: FIREBASE_AUTH_DOMAIN" && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" || (echo "Missing GitHub Actions secret: FIREBASE_PROJECT_ID" && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" || (echo "Missing GitHub Actions secret: FIREBASE_STORAGE_BUCKET" && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" || (echo "Missing GitHub Actions secret: FIREBASE_MESSAGING_SENDER_ID" && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_APP_ID" || (echo "Missing GitHub Actions secret: FIREBASE_APP_ID" && exit 1)
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
